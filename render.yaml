
databases:
  - name: padosipro-db
    plan: free
    databaseName: padosipro
    user: padosi

services:
  - type: web
    name: padosipro-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: pnpm run render:build
    startCommand: pnpm run render:start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: "0.0.0.0"
      - key: DATABASE_URL
        fromDatabase:
          name: padosipro-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_TTL_MS
        value: "2592000000"
      - key: CORS_ORIGIN
        value: "*"
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: resend
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: "PadosiPro <onboarding@resend.dev>"
